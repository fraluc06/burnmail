version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - go
    groups:
      go-minor-patch:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-patch:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: build
      include: scope
