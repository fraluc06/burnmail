name: Release

# Triggered by pushing a semver tag: git tag v1.2.3 && git push origin v1.2.3
# The tag is the single source of truth for the version (injected via ldflags).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must follow vX.Y.Z (got: $GITHUB_REF_NAME)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build for all platforms
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X burnmail/internal/config.Version=$VERSION"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            ext=""; [ "$goos" = windows ] && ext=".exe"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags="$LDFLAGS" -o "dist/burnmail-$goos-$goarch$ext" .
          done
          cd dist && sha256sum * > checksums.txt

      - name: Smoke test
        run: |
          chmod +x dist/burnmail-linux-amd64
          OUTPUT=$(./dist/burnmail-linux-amd64 --version 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qF "$VERSION"

      # HEAD is the tagged commit: git describe on its parent resolves to the previous release tag.
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "changelog<<EOF"
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release"
            else
              echo "**Changes since $PREV_TAG:**"
              echo ""
              git log --oneline --no-merges "$PREV_TAG..HEAD"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Burnmail ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---
            **Install:** [README](https://github.com/${{ github.repository }}#installation) · `go install github.com/${{ github.repository }}@${{ github.ref_name }}` · **Docker:** `docker pull ghcr.io/${{ github.repository }}:${{ env.VERSION }}` · **Checksums:** `checksums.txt`
          files: dist/*

      - name: Release summary
        run: |
          echo "## [${{ github.ref_name }} released](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the multi-arch image to GHCR. The version baked into the binary
  # is the one carried by the tag that triggered the release.
  docker:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is needed to run the arm64 runtime stage (adduser) on amd64 runners;
      # the Go build itself cross-compiles natively via TARGETOS/TARGETARCH.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Image published: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
